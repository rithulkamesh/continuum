[build-system]
# torch is a compile-time dependency, not just a runtime one: core headers
# (include/continuum/ir/value.hpp and others) include <torch/...>, and
# CMakeLists.txt runs `import torch` to locate libtorch's CMake package.
# It must therefore be present in the build environment.
requires = ["scikit-build-core>=0.9", "pybind11>=2.11", "torch>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "continuum-ai"
version = "1.0.0"
description = "Unified runtime for token + tensor program execution across LLM and ML backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]
license = { file = "LICENSE" }
authors = [{ name = "Rithul Kamesh", email = "hi@rithul.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.10", "hypothesis>=6"]
docs = ["sphinx>=7.4", "furo>=2024.7.18", "breathe>=4.35.0"]
test = ["pytest>=8", "pytest-cov>=5.0", "hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/rithulkamesh/continuum"
Documentation = "https://ct.rithul.dev/python/"
Source = "https://github.com/rithulkamesh/continuum"
Issues = "https://github.com/rithulkamesh/continuum/issues"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/continuum"]
cmake.define.CONTINUUM_BUILD_PYTHON = "ON"
cmake.define.CONTINUUM_BUILD_TESTS = "OFF"

[[tool.uv.index]]
# CPU-only torch wheels: a few hundred MB instead of the multi-GB CUDA build.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--cov=continuum --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned to the historical default set. Newer ruff releases widened their
# implicit defaults to include I/RUF/UP; adopting those (and B, SIM) is tracked
# in docs/design/code-standards-audit.md, to land once the toolchain is wired
# up locally to validate the whole tree in one pass.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["python/continuum"]
branch = true
omit = ["python/continuum/benchmarks/*", "python/continuum/_native.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
