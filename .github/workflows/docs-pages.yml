name: docs-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - run: python -m pip install --upgrade pip
      - run: pip install sphinx furo breathe
      - run: git clone --depth 1 --branch v2.3.4 https://github.com/jothepro/doxygen-awesome-css.git docs/doxygen-awesome-css
      - run: PYTHONPATH=python sphinx-build -b html docs/api/python docs/api/python/_build
      - run: doxygen Doxyfile
      - run: mkdir -p site/python site/cpp
      - run: cp -R docs/api/python/_build/* site/python/
      - run: cp -R docs/api/cpp/html/* site/cpp/
      - run: cp docs/site/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
